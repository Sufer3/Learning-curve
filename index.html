<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#8d6cff">
<link rel="icon" type="image/png" href="icons/favicon-48.png">

<title>Let's Learn to Read</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:"Segoe UI","Comic Sans MS","Chalkboard SE",sans-serif;
    min-height:100vh;
    background:linear-gradient(180deg,#8ee7ff 0%,#b8f3ff 35%,#fff5c7 100%);
    color:#24304a;
    overflow-x:hidden;
}

.background-shape{
    position:fixed;
    border-radius:50%;
    pointer-events:none;
    z-index:0;
    opacity:.45;
}

.shape-one{
    width:150px;
    height:150px;
    background:#ff9ed2;
    top:5%;
    left:-50px;
    animation:floatOne 7s ease-in-out infinite;
}

.shape-two{
    width:110px;
    height:110px;
    background:#ffe66d;
    top:40%;
    right:-35px;
    animation:floatTwo 8s ease-in-out infinite;
}

.shape-three{
    width:90px;
    height:90px;
    background:#a7f3a0;
    bottom:8%;
    left:5%;
    animation:floatThree 6s ease-in-out infinite;
}

@keyframes floatOne{
    0%,100%{transform:translateY(0) rotate(0);}
    50%{transform:translateY(30px) rotate(20deg);}
}

@keyframes floatTwo{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-35px);}
}

@keyframes floatThree{
    0%,100%{transform:translateY(0) scale(1);}
    50%{transform:translateY(-25px) scale(1.1);}
}

.app{
    position:relative;
    z-index:1;
    width:100%;
    max-width:850px;
    margin:auto;
    padding:15px;
}

header{
    background:linear-gradient(135deg,#ff66b3,#9b6cff,#48c6ef);
    color:white;
    border-radius:28px;
    padding:22px 18px;
    text-align:center;
    box-shadow:0 10px 25px rgba(72,70,130,.25);
    position:relative;
    overflow:hidden;
    animation:headerPop .8s ease;
}

@keyframes headerPop{
    from{transform:translateY(-30px);opacity:0;}
    to{transform:translateY(0);opacity:1;}
}

header h1{
    font-size:clamp(28px,7vw,48px);
    margin-bottom:6px;
    text-shadow:2px 3px 0 rgba(0,0,0,.12);
}

header p{
    font-size:16px;
    font-weight:600;
}

.star{
    position:absolute;
    font-size:25px;
    animation:starTwinkle 2s ease-in-out infinite;
}

.star-one{left:8%;top:18%;}
.star-two{right:10%;top:12%;animation-delay:.5s;}
.star-three{left:18%;bottom:10%;animation-delay:1s;}

@keyframes starTwinkle{
    0%,100%{transform:scale(1) rotate(0);opacity:.7;}
    50%{transform:scale(1.4) rotate(20deg);opacity:1;}
}

/* MUSIC */

.music-box{
    margin-top:15px;
    background:rgba(255,255,255,.96);
    border-radius:20px;
    padding:13px 15px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    box-shadow:0 5px 15px rgba(0,0,0,.12);
}

.music-info{
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:800;
}

.music-icon{
    font-size:28px;
    animation:musicBounce 1s ease-in-out infinite;
}

@keyframes musicBounce{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-5px);}
}

.music-controls{
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:9px;
}

.volume-slider{
    width:120px;
    height:8px;
    cursor:pointer;
    accent-color:#8d6cff;
}

.volume-number{
    min-width:38px;
    text-align:center;
    font-size:13px;
    font-weight:800;
    color:#7048d8;
}

.music-button{
    border:none;
    background:linear-gradient(135deg,#ff70b8,#9b6cff);
    color:white;
    padding:10px 15px;
    border-radius:14px;
    font-size:15px;
    font-weight:800;
    cursor:pointer;
}

.music-button:active{
    transform:scale(.95);
}

/* PROGRESS */

.progress-area{
    background:white;
    border-radius:20px;
    padding:15px;
    margin-top:15px;
    box-shadow:0 5px 15px rgba(0,0,0,.10);
}

.progress-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:8px;
    font-weight:800;
}

.progress-bar{
    width:100%;
    height:18px;
    background:#e9edf7;
    border-radius:20px;
    overflow:hidden;
}

.progress-fill{
    height:100%;
    width:0%;
    border-radius:20px;
    background:linear-gradient(90deg,#ff69b4,#8f7cff,#45d6ff,#62df83);
    transition:width .6s ease;
}

/* CARDS */

.card{
    background:rgba(255,255,255,.96);
    border-radius:28px;
    padding:25px 18px;
    margin-top:18px;
    box-shadow:0 8px 25px rgba(61,67,120,.14);
    animation:cardAppear .5s ease;
}

@keyframes cardAppear{
    from{opacity:0;transform:translateY(20px) scale(.97);}
    to{opacity:1;transform:translateY(0) scale(1);}
}

.welcome-title{
    text-align:center;
    color:#7048d8;
    font-size:clamp(25px,6vw,38px);
    margin-bottom:10px;
}

.welcome-text{
    text-align:center;
    font-size:17px;
    line-height:1.6;
    margin-bottom:20px;
}

.start-button{
    display:block;
    width:100%;
    max-width:400px;
    margin:20px auto;
    border:none;
    border-radius:20px;
    padding:16px;
    background:linear-gradient(135deg,#ff5fac,#8d6cff);
    color:white;
    font-size:21px;
    font-weight:900;
    cursor:pointer;
    box-shadow:0 8px 0 #684bc5,0 12px 20px rgba(90,70,180,.2);
}

.start-button:active{
    transform:translateY(5px);
    box-shadow:0 3px 0 #684bc5;
}

.lesson-title{
    text-align:center;
    font-size:25px;
    margin:25px 0 15px;
    color:#4f56b8;
}

.lesson-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:14px;
}

.lesson-card{
    border:none;
    border-radius:22px;
    padding:20px;
    text-align:left;
    cursor:pointer;
    min-height:145px;
    color:#24304a;
    transition:.2s;
    position:relative;
    overflow:hidden;
}

.lesson-card:hover{
    transform:translateY(-5px);
}

.lesson-card::after{
    content:"✨";
    position:absolute;
    right:12px;
    top:8px;
    font-size:25px;
    animation:starTwinkle 2s infinite;
}

.lesson-one{background:linear-gradient(135deg,#ffd1e8,#ffe6f2);}
.lesson-two{background:linear-gradient(135deg,#c8f3ff,#ddf9ff);}
.lesson-three{background:linear-gradient(135deg,#fff0ad,#fff7d4);}
.lesson-four{background:linear-gradient(135deg,#d8ffd3,#ecffe9);}
.lesson-five{background:linear-gradient(135deg,#dfd3ff,#f0ebff);}

.lesson-icon{
    font-size:40px;
    display:block;
    margin-bottom:8px;
}

.lesson-card h3{
    font-size:19px;
    margin-bottom:6px;
}

.lesson-card p{
    font-size:14px;
    line-height:1.4;
}

button{
    font-family:inherit;
}

.main-button{
    border:none;
    border-radius:17px;
    padding:13px 20px;
    background:linear-gradient(135deg,#6979ff,#9a65ff);
    color:white;
    font-weight:800;
    font-size:16px;
    cursor:pointer;
    margin:6px;
    box-shadow:0 5px 0 #5949bb;
}

.main-button:active{
    transform:translateY(3px);
    box-shadow:0 2px 0 #5949bb;
}

.back-button{
    background:linear-gradient(135deg,#ff8b8b,#ffb36b);
    box-shadow:0 5px 0 #dc765d;
}

.teach-box{
    text-align:center;
    padding:10px;
}

.big-letter{
    font-size:clamp(100px,30vw,190px);
    font-weight:900;
    line-height:1;
    color:#8a5cf6;
    text-shadow:4px 5px 0 #e2d7ff;
    animation:letterBounce 1.5s ease-in-out infinite;
}

@keyframes letterBounce{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-12px);}
}

.sound-text{
    font-size:30px;
    color:#ff5ca8;
    font-weight:900;
    margin:10px;
}

.word-display{
    font-size:28px;
    font-weight:900;
    color:#3f54bb;
    margin:12px;
}

.picture{
    font-size:75px;
    margin:10px;
    animation:pictureFloat 2s ease-in-out infinite;
}

@keyframes pictureFloat{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-8px);}
}

.instruction{
    text-align:center;
    font-size:18px;
    line-height:1.5;
    margin:15px auto;
    max-width:600px;
    background:#f7f5ff;
    padding:15px;
    border-radius:18px;
}

.answer-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(100px,1fr));
    gap:12px;
    max-width:600px;
    margin:20px auto;
}

.answer-button{
    border:3px solid #ddd7ff;
    background:white;
    border-radius:18px;
    padding:15px;
    font-size:25px;
    font-weight:900;
    cursor:pointer;
    transition:.2s;
}

.answer-button:hover{
    background:#f2eeff;
    transform:scale(1.05);
}

.answer-button.correct{
    background:#aaf5b0;
    border-color:#54c962;
}

.answer-button.wrong{
    background:#ffb0b0;
    border-color:#ff6969;
}

.feedback{
    min-height:45px;
    text-align:center;
    font-size:21px;
    font-weight:900;
    margin:15px;
}

.feedback.good{color:#28a745;}
.feedback.try{color:#e65b5b;}

.result-box{
    text-align:center;
    padding:25px;
    border-radius:25px;
    background:linear-gradient(135deg,#fff4b8,#ffe1f0);
}

.result-emoji{
    font-size:75px;
    margin-bottom:10px;
}

.result-box h2{
    font-size:30px;
    color:#694bd6;
    margin-bottom:10px;
}

.score{
    font-size:26px;
    font-weight:900;
    margin:10px;
}

.screen{display:none;}
.screen.active{display:block;}

.confetti{
    position:fixed;
    top:-20px;
    font-size:25px;
    pointer-events:none;
    z-index:9999;
    animation:confettiFall 2.5s linear forwards;
}

@keyframes confettiFall{
    to{
        transform:translateY(110vh) rotate(720deg);
        opacity:0;
    }
}

@media(max-width:600px){

    .app{
        padding:10px;
    }

    header{
        border-radius:22px;
    }

    .music-box{
        flex-direction:column;
        text-align:center;
    }

    .music-controls{
        width:100%;
        justify-content:center;
        flex-wrap:wrap;
    }

    .volume-slider{
        width:150px;
    }

    .lesson-grid{
        grid-template-columns:1fr;
    }

    .card{
        padding:20px 13px;
    }

    .big-letter{
        font-size:120px;
    }

    .answer-grid{
        grid-template-columns:repeat(3,1fr);
    }
}

</style>
</head>

<body>

<div class="background-shape shape-one"></div>
<div class="background-shape shape-two"></div>
<div class="background-shape shape-three"></div>

<div class="app">

<header>

<div class="star star-one">⭐</div>
<div class="star star-two">✨</div>
<div class="star star-three">🌟</div>

<h1>📚 Let's Learn to Read!</h1>

<p>Learn • Practice • Read • Have Fun!</p>

</header>

<!-- MUSIC -->

<div class="music-box">

<div class="music-info">

<span class="music-icon">🎵</span>

<span id="musicStatus">
Theme Music
</span>

</div>

<div class="music-controls">

<span>🔉</span>

<input
type="range"
id="volumeSlider"
class="volume-slider"
min="0"
max="100"
value="25"
>

<span
id="volumeNumber"
class="volume-number"
>
25%
</span>

<button
class="music-button"
id="musicButton"
onclick="toggleMusic()"
>
🔊 Music On
</button>

</div>

</div>

<!-- PROGRESS -->

<div class="progress-area">

<div class="progress-top">

<span>🌟 Your Reading Journey</span>

<span id="progressText">0%</span>

</div>

<div class="progress-bar">

<div
class="progress-fill"
id="progressFill"
></div>

</div>

</div>

<!-- HOME -->

<section
id="homeScreen"
class="screen active"
>

<div class="card">

<h2 class="welcome-title">
🌈 Welcome, Little Reader!
</h2>

<p class="welcome-text">

We are going to learn how to read
one little step at a time! 💕

<br><br>

Listen carefully, practice,
and remember...
<strong>mistakes are okay!</strong> 🌟

</p>

<button
id="startButton"
class="start-button"
onclick="startLearning()"
>
🚀 Let's Start Learning!
</button>

<div
id="introListening"
class="feedback"
></div>

<h2 class="lesson-title">
🎒 Choose a Lesson
</h2>

<div class="lesson-grid">

<button
class="lesson-card lesson-one"
onclick="startLetters()"
>

<span class="lesson-icon">🔤</span>

<h3>1. Letter Sounds</h3>

<p>
Learn what sounds the letters make.
</p>

</button>

<button
class="lesson-card lesson-two"
onclick="startBlending()"
>

<span class="lesson-icon">🧩</span>

<h3>2. Blend Sounds</h3>

<p>
Put sounds together to make words.
</p>

</button>

<button
class="lesson-card lesson-three"
onclick="startWords()"
>

<span class="lesson-icon">📖</span>

<h3>3. Reading Words</h3>

<p>
Practice reading simple words.
</p>

</button>

<button
class="lesson-card lesson-four"
onclick="startDigraphs()"
>

<span class="lesson-icon">🔊</span>

<h3>4. Special Sounds</h3>

<p>
Learn sounds like SH, CH and TH.
</p>

</button>

<button
class="lesson-card lesson-five"
onclick="startSentences()"
>

<span class="lesson-icon">💬</span>

<h3>5. Simple Sentences</h3>

<p>
Read short sentences and understand them.
</p>

</button>

</div>

</div>

</section>

<section
id="lessonScreen"
class="screen"
>

<div class="card">

<div id="lessonContent"></div>

</div>

</section>

</div>

<script>

/* =========================
   AUDIO
========================= */

let currentAudio=null;
let themeAudio=null;

let musicMuted=
localStorage.getItem("themeMuted")==="true";

let musicVolume=
Number(localStorage.getItem("themeVolume"));

if(
isNaN(musicVolume) ||
musicVolume<0 ||
musicVolume>100
){
musicVolume=25;
}


/* =========================
   LETTERS
========================= */

const LETTERS=[

{letter:"A",sound:"/ă/",spoken:"a",word:"Apple",emoji:"🍎"},
{letter:"B",sound:"/b/",spoken:"b",word:"Ball",emoji:"⚽"},
{letter:"C",sound:"/k/",spoken:"k",word:"Cat",emoji:"🐱"},
{letter:"D",sound:"/d/",spoken:"d",word:"Dog",emoji:"🐶"},
{letter:"E",sound:"/ĕ/",spoken:"e",word:"Egg",emoji:"🥚"},
{letter:"F",sound:"/f/",spoken:"ffff",word:"Fish",emoji:"🐟"},
{letter:"G",sound:"/g/",spoken:"g",word:"Goat",emoji:"🐐"},
{letter:"H",sound:"/h/",spoken:"h",word:"Hat",emoji:"🎩"},
{letter:"I",sound:"/ĭ/",spoken:"i",word:"Igloo",emoji:"🏠"},
{letter:"J",sound:"/j/",spoken:"j",word:"Jam",emoji:"🍓"},
{letter:"K",sound:"/k/",spoken:"k",word:"Kite",emoji:"🪁"},
{letter:"L",sound:"/l/",spoken:"llll",word:"Lion",emoji:"🦁"},
{letter:"M",sound:"/m/",spoken:"mmmm",word:"Moon",emoji:"🌙"},
{letter:"N",sound:"/n/",spoken:"nnnn",word:"Nest",emoji:"🪺"},
{letter:"O",sound:"/ŏ/",spoken:"o",word:"Octopus",emoji:"🐙"},
{letter:"P",sound:"/p/",spoken:"p",word:"Pig",emoji:"🐷"},
{letter:"Q",sound:"/kw/",spoken:"kw",word:"Queen",emoji:"👑"},
{letter:"R",sound:"/r/",spoken:"rrrr",word:"Rabbit",emoji:"🐰"},
{letter:"S",sound:"/s/",spoken:"ssss",word:"Sun",emoji:"☀️"},
{letter:"T",sound:"/t/",spoken:"t",word:"Tiger",emoji:"🐯"},
{letter:"U",sound:"/ŭ/",spoken:"u",word:"Umbrella",emoji:"☂️"},
{letter:"V",sound:"/v/",spoken:"vvvv",word:"Van",emoji:"🚐"},
{letter:"W",sound:"/w/",spoken:"w",word:"Web",emoji:"🕸️"},
{letter:"X",sound:"/ks/",spoken:"ks",word:"Fox",emoji:"🦊"},
{letter:"Y",sound:"/y/",spoken:"y",word:"Yo-yo",emoji:"🪀"},
{letter:"Z",sound:"/z/",spoken:"zzzz",word:"Zebra",emoji:"🦓"}

];


/* =========================
   WORDS
========================= */

const WORDS=[

["cat","🐱"],
["dog","🐶"],
["sun","☀️"],
["pig","🐷"],
["hat","🎩"],
["bed","🛏️"],
["map","🗺️"],
["fish","🐟"],
["log","🪵"],
["cup","🥤"]

];


/* =========================
   SPECIAL SOUNDS
========================= */

const DIGRAPHS=[

["sh","ship","🚢"],
["ch","chip","🍟"],
["th","thin","🪶"],
["wh","when","❓"],
["ck","duck","🦆"],
["ng","ring","💍"],
["bl","blue","🔵"],
["st","star","⭐"],
["tr","tree","🌳"],
["fl","flag","🚩"]

];


/* =========================
   SENTENCES
========================= */

const SENTENCES=[

["The cat is big.","🐱"],
["I see a dog.","🐶"],
["The sun is hot.","☀️"],
["The pig can run.","🐷"],
["I see a red hat.","🎩"],
["The fish can swim.","🐟"],
["The sun is up.","☀️"],
["The cat can nap.","🐱"]

];


/* =========================
   AUDIO HELPERS
========================= */

function stopAudio(){

if(currentAudio){

currentAudio.pause();
currentAudio.currentTime=0;
currentAudio=null;

}

}


function speak(text,rate=.8){

if(!window.speechSynthesis)return;

window.speechSynthesis.cancel();

const utterance=
new SpeechSynthesisUtterance(text);

utterance.lang="en-US";
utterance.rate=rate;
utterance.pitch=1.08;
utterance.volume=1;

window.speechSynthesis.speak(utterance);

}


function playAudioFile(filename,fallbackText){

stopAudio();

if(window.speechSynthesis){
window.speechSynthesis.cancel();
}

const audio=new Audio(filename);

currentAudio=audio;
audio.preload="auto";

audio.onended=function(){

if(currentAudio===audio){
currentAudio=null;
}

};

audio.onerror=function(){

currentAudio=null;

if(fallbackText){
speak(fallbackText);
}

};

audio.play().catch(function(){

if(fallbackText){
speak(fallbackText);
}

});

}


function playLetterSound(index){

const item=LETTERS[index];

if(!item)return;

playAudioFile(
"audio/"+item.letter.toLowerCase()+".mp3",
item.spoken
);

}


/* =========================
   THEME MUSIC
========================= */

function setupThemeMusic(){

themeAudio=
new Audio("audio/theme-song.mp3");

themeAudio.loop=true;

themeAudio.volume=
musicVolume/100;

updateMusicButton();

}


function startThemeMusic(){

if(musicMuted)return;

if(!themeAudio){
setupThemeMusic();
}

themeAudio.volume=
musicVolume/100;

themeAudio.play().catch(function(){});

}


function changeMusicVolume(value){

musicVolume=Number(value);

if(isNaN(musicVolume)){
musicVolume=25;
}

if(!themeAudio){
setupThemeMusic();
}

themeAudio.volume=
musicVolume/100;

localStorage.setItem(
"themeVolume",
musicVolume
);

const number=
document.getElementById("volumeNumber");

if(number){
number.textContent=
musicVolume+"%";
}

}


function toggleMusic(){

if(!themeAudio){
setupThemeMusic();
}

musicMuted=!musicMuted;

localStorage.setItem(
"themeMuted",
musicMuted
);

if(musicMuted){

themeAudio.pause();

document.getElementById(
"musicStatus"
).textContent=
"Music Muted";

}else{

themeAudio.volume=
musicVolume/100;

themeAudio.play().catch(function(){});

document.getElementById(
"musicStatus"
).textContent=
"Theme Music";

}

updateMusicButton();

}


function updateMusicButton(){

const button=
document.getElementById("musicButton");

if(!button)return;

if(musicMuted){

button.textContent=
"🔇 Music Off";

}else{

button.textContent=
"🔊 Music On";

}

}


/* =========================
   START
========================= */

function startLearning(){

startThemeMusic();

document.getElementById(
"introListening"
).textContent=
"🌟 Let's learn together!";

startLetters();

}


/* =========================
   SCREEN CONTROL
========================= */

function showLesson(html){

document.getElementById(
"homeScreen"
).classList.remove("active");

document.getElementById(
"lessonScreen"
).classList.add("active");

document.getElementById(
"lessonContent"
).innerHTML=html;

window.scrollTo({
top:0,
behavior:"smooth"
});

}


function goHome(){

stopAudio();

document.getElementById(
"lessonScreen"
).classList.remove("active");

document.getElementById(
"homeScreen"
).classList.add("active");

}


/* =========================
   LETTER LESSON
========================= */

let letterIndex=0;

function startLetters(){

letterIndex=0;
showLetter();

}


function showLetter(){

const item=LETTERS[letterIndex];

showLesson(`

<div class="teach-box">

<h2 class="lesson-title">
🔤 Letter Sounds
</h2>

<div class="instruction">

function displayLetterPractice(){

const item=LETTERS[practiceLetter];

const choices=
makeLetterChoices(practiceLetter);

showLesson(`

<div class="teach-box">

<h2 class="lesson-title">
🎯 Letter Practice
</h2>

<div class="instruction">
Which letter makes this sound?
</div>

<div class="sound-text">
🔊 ${item.sound}

class="main-button"

🔊 Hear Again
</button>

<div
id="practiceFeedback"
class="feedback"
></div>

<div class="answer-grid">

${choices.map(function(index){

return `

<button
class="answer-button"
onclick="checkLetterPractice(${index},${practiceLetter})"
>
${LETTERS[index].letter}
</button>

`;

}).join("")}

</div>

<button
class="main-button back-button"
onclick="goHome()"
>
🏠 Home
</button>

</div>

`);

setTimeout(function(){
playLetterSound(practiceLetter);
},300);

}


function makeLetterChoices(correct){

const set=[correct];

while(set.length<3){

const random=
Math.floor(
Math.random()*LETTERS.length
);

if(!set.includes(random)){
set.push(random);
}

}

return set.sort(
function(){
return Math.random()-.5;
}
);

}


function checkLetterPractice(selected,correct){

const feedback=
document.getElementById(
"practiceFeedback"
);

if(selected===correct){

feedback.textContent=
"🎉 Great job! That's correct!";

feedback.className=
"feedback good";

celebrate();

setTimeout(function(){

if(practiceLetter<LETTERS.length-1){

practiceLetter++;
displayLetterPractice();

}else{

startLetterTest();

}

},900);

}else{

feedback.textContent=
"💛 Almost! Listen again and try.";

feedback.className=
"feedback try";

playLetterSound(correct);

}

}

========================= */

showLesson(`

class="answer-button"

</button>

`;

}).join("")}

</div>

</div>

`);

setTimeout(function(){
playLetterSound(letterTestIndex);
},300);

}


function answerLetterTest(selected,correct){

if(selected===correct){
letterScore++;
}

letterTestIndex++;

if(letterTestIndex>=LETTERS.length){

finishLetterTest();

}else{

showLetterTest();

}

}


function finishLetterTest(){

const percent=
Math.round(
(letterScore/LETTERS.length)*100
);

if(percent>=95){

localStorage.setItem(
"letterPassed",
"true"
);

celebrate();

showLesson(`

<div class="result-box">

<div class="result-emoji">
🏆🎉🌟
</div>

You scored ${percent}%!
</div>

You passed the Letter Sounds test!
</p>

<br>

<button
class="main-button"
onclick="startBlending()"
>
🚀 Next Lesson
</button>

<button
class="main-button back-button"
onclick="goHome()"
>
🏠 Home
</button>

</div>

`);

}else{

showLesson(`

<div class="result-box">

<div class="result-emoji">
💛🌟
</div>

<h2>Keep Practicing!</h2>

<div class="score">
You scored ${percent}%.
</div>

<p>
That's okay! Let's practice the sounds
again together.
</p>

<br>

<button
class="main-button"
onclick="startLetters()"
>
🔤 Practice Again
</button>

<button
class="main-button back-button"
onclick="goHome()"
>
🏠 Home
</button>

</div>

`);

}

updateProgress();

}

percent+"%";

/* =========================
   CONFETTI
========================= */

function celebrate(){

const emojis=[
"⭐","✨","🌟","🎉",
"💖","🌈","🎈","🦋"
];

for(let i=0;i<18;i++){

const confetti=
document.createElement("div");

confetti.className="confetti";

confetti.textContent=
emojis[
Math.floor(
Math.random()*emojis.length
)
];

confetti.style.left=
Math.random()*100+"%";

confetti.style.animationDelay=
Math.random()*.8+"s";

document.body.appendChild(confetti);

setTimeout(function(){
confetti.remove();
},3500);

}

}
